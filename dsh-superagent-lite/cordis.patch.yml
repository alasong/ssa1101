# dsh-superagent-lite 的加载器补丁层（K01）
# 用法二选一：
#   1) 作为 bundle：被 profile 的 dsh.profile.bundles 引用时自动叠加（包元数据由 K06 补）；
#   2) 作为 overlay：dsh --profile superagent --patch ./dsh-superagent-lite/cordis.patch.yml
# 相对路径按「补丁文件所在目录」解析（cordis-composition-reference：inserted relative paths
# are anchored beside their patch file），所以这里写 ./src/index.ts 而不是仓库绝对路径。
- insert:
    - id: superagent-lite
      name: './src/index.ts'
