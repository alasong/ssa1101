# worker 会话的凭据层。
#
# headless 模板把整条「账户授权」链路都关掉了（credentials / authorization /
# deepseek-account 三个插件都是 `disabled: true`），只留「启动环境里 export
# DEEPSEEK_API_KEY」这一条路；而本机 `.credentials.yaml` 里那把
# refs.DEEPSEEK_API_KEY 已失效（401，尾号 d870），于是 worker 一跑就失败。
#
# 桌面 GUI 能跑，靠的不是 API key，而是账户授权（`.credentials.yaml` 里的
# deepseek-account-platform grant）。这里把同一条链路在 headless 里接回来：
#   credentials          打开 → 能读 ~/.dsh/.credentials.yaml
#   deepseek-account     打开 → 提供 deepseekAccount 服务（按目标地址取账号 token）
#   authorization        打开 → 账户路由的准入
#   llm-deepseek-account 插入 → 注册 provider 路由 "deepseek-account"
#   agent-default-model  指向该路由（模型名取自账户 /models 列表）
#
# 用法：dsh --profile headless --patch presets/credentials.patch.yml --json "<任务>"
- id: credentials
  disabled: false
- id: deepseek-account
  disabled: false
- id: authorization
  disabled: false
- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-chat
